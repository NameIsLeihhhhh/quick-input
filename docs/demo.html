<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alt+J 启动器 · 演示</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f15; --panel:#0f151d; --line:#2a3646; --accent:#7c5cff;
  --txt:#e6eef8; --dim:#66748a; --hint:#6c768c; --sel:#132a45; --blue:#7caaff;
  --row:30px;
}
html,body{height:100%}
body{background:#07090d;color:#e6edf3;overflow-x:hidden;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}

/* ── 舞台：假装是一块桌面 ── */
#stage{position:relative;width:100%;max-width:1180px;height:640px;margin:0 auto;overflow:hidden;
  background:radial-gradient(900px 500px at 50% 0%,#16202c 0%,#0a0e14 60%,#06080b 100%)}
.fakewin{position:absolute;border-radius:10px;background:linear-gradient(180deg,#141c26,#0e141c);
  border:1px solid #1b2532;opacity:.5}
.fakewin .bar{height:26px;border-bottom:1px solid #1b2532;display:flex;align-items:center;gap:6px;padding:0 10px}
.fakewin .dot{width:8px;height:8px;border-radius:50%;background:#2b3644}
.fakewin .ln{height:9px;border-radius:5px;background:#1a2430;margin:12px 16px}

/* ── 浮层 ── */
#qi{position:absolute;left:50%;top:50%;width:560px;transform:translate(-50%,-50%) scale(.94);
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(124,92,255,.08);
  opacity:0;transition:opacity .18s ease,transform .18s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#qi.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#qi.off{opacity:0;transform:translate(-50%,-48%) scale(.97)}
.head{display:flex;align-items:center;gap:14px;height:80px;padding:0 27px}
.badge{width:22px;height:22px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(160deg,#9b7bff,#6c3ee0);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(124,92,255,.45)}
#typed{font-size:19px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;letter-spacing:.2px}
#typed.ph{color:#4d5866}
.caret{display:inline-block;width:2px;height:22px;background:var(--blue);vertical-align:-4px;
  animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}

.list{border-top:1px solid #222c38;margin:0 14px;padding:4px 0 0}
.row{display:flex;align-items:center;height:var(--row);padding:0 8px;border-radius:6px;
  opacity:0;transform:translateY(-4px);transition:background .12s}
.row.in{opacity:1;transform:none;animation:slidein .22s ease both}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.row.sel{background:var(--sel)}
.ico{width:18px;height:18px;flex:0 0 auto;margin-right:10px}
.nm{font-size:19px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.nm b{color:var(--blue);font-weight:700}
.pth{font-size:13px;color:var(--dim);margin-left:22px;white-space:nowrap;flex:0 0 auto;max-width:184px;
  overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.foot{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 27px;font-size:12px}
.foot .l{color:var(--blue)}.foot .l.ok{color:#6fce93}.foot .l.purple{color:var(--accent)}
.foot .r{color:var(--hint)}

/* ── Alt+J 键帽 ── */
#key{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;gap:8px;
  align-items:center;opacity:0;transition:opacity .2s}
#key.on{opacity:1}
.cap{background:#161d27;border:1px solid #2b3644;border-bottom-width:3px;border-radius:7px;
  padding:5px 11px;font-size:12px;color:#9fb0c4;font-weight:600;transition:all .08s}
.cap.down{background:#241a3d;border-color:var(--accent);color:#c9b8ff;transform:translateY(2px);border-bottom-width:1px}
.plus{color:#4d5866;font-size:12px}

/* ── 结果提示（右侧飘出的小卡片）── */
#toast{position:absolute;left:50%;top:calc(50% + 150px);transform:translate(-50%,8px);opacity:0;
  transition:all .3s cubic-bezier(.2,.9,.3,1.2);background:#101822;border:1px solid #243040;
  border-radius:12px;padding:12px 18px;font-size:13px;color:#a8bacd;box-shadow:0 16px 40px rgba(0,0,0,.6);
  max-width:520px;text-align:center;line-height:1.6}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{color:#cfe0f0}

/* ── 鼠标指针 ── */
#mouse{position:absolute;width:18px;height:18px;opacity:0;transition:all .5s ease;z-index:9;pointer-events:none}
#mouse svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}

/* ── 底部控制条 ── */
#hud{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;
  padding:16px 8px 26px;gap:16px;flex-wrap:wrap}
#scenes{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{background:#101822;border:1px solid #1e2836;border-radius:8px;padding:6px 12px;font-size:12px;
  color:#7d8b9c;cursor:pointer;transition:all .15s}
.sbtn:hover{border-color:#33415a;color:#b6c6d8}
.sbtn.active{background:#1a1330;border-color:var(--accent);color:#c9b8ff}
#title{font-size:15px;font-weight:700;color:#dbe6f2;margin-bottom:4px}
#sub{font-size:12px;color:#5d6b7b}
.left{flex:1 1 320px;min-width:260px}
#replay{background:#1a1330;border:1px solid var(--accent);color:#c9b8ff;border-radius:8px;
  padding:7px 16px;font-size:12px;cursor:pointer;font-weight:600}
#replay:hover{background:#241a3d}
</style>
</head>
<body>

<div id="stage">
  <div class="fakewin" style="left:60px;top:60px;width:420px;height:240px">
    <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="ln" style="width:70%"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:52%"></div>
  </div>
  <div class="fakewin" style="right:70px;bottom:80px;width:360px;height:200px">
    <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="ln" style="width:60%"></div><div class="ln" style="width:80%"></div>
  </div>

  <div id="qi">
    <div class="head">
      <div class="badge">Q</div>
      <div id="typed"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <div class="l" id="fl">文件搜索 · 输入关键词</div>
      <div class="r" id="fr">↑↓ 选择    Enter 打开    Esc 关闭</div>
    </div>
  </div>

  <div id="key">
    <span class="cap" id="k1">Alt</span><span class="plus">+</span><span class="cap" id="k2">J</span>
  </div>

  <div id="toast"></div>

  <div id="mouse"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 3l14 8-6 1.5L10.5 19z" fill="#fff" stroke="#111" stroke-width="1.2"/></svg></div>
</div>

<div id="hud">
  <div class="left">
    <div id="title">按 Alt+J 弹出一个输入框，三种去向</div>
    <div id="sub">下面会自动演一遍。也可以点场景直接看那一段。</div>
  </div>
  <div id="scenes"></div>
  <button id="replay">重播</button>
</div>

<script>
const SCENES = [
  { id:'dsh',   label:'① 发给 DSH',  title:'打字 → 回车 → 内容进 DSH 新会话',
    sub:'当前窗口纹丝不动，不切窗口、不抢焦点、不碰剪贴板。' },
  { id:'site',  label:'② 站点搜索',  title:'别名 + 关键词 → 直接开浏览器搜',
    sub:'hh = 小红书、bb = B站…空格可以省：hh800库 一样认。' },
  { id:'files', label:'③ 搜本机文件', title:'/ 开头 → 搜本机文件，↑↓ 选、回车打开',
    sub:'走 Everything 的内存索引，毫秒级。' },
  { id:'keep',  label:'④ 点外面收起', title:'点浮层外面就收起，再按 Alt+J 原样回来',
    sub:'输入的文字、结果、选中第几条、滚到哪儿，全都在。' },
];

const HITS = [
  { n:'2026 二季度经营分析报告.docx', p:'D:\\工作\\2026\\经营分析', k:'w',  hl:1 },
  { n:'季度报告数据底表.xlsx',        p:'D:\\工作\\2026\\底表',     k:'x',  hl:2 },
  { n:'Q1 季度报告（终稿）.pdf',      p:'D:\\工作\\2026\\归档',     k:'pdf',hl:2 },
  { n:'报告归档',                     p:'D:\\工作\\2026',          k:'dir' },
];

const ICONS = {
  w:  '<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#2b579a"/><path d="M14 2l6 6h-6z" fill="#4a7ec4"/><text x="11.5" y="17.5" font-size="7" font-weight="700" fill="#fff" text-anchor="middle" font-family="Segoe UI,sans-serif">W</text></svg>',
  x:  '<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#1d6f42"/><path d="M14 2l6 6h-6z" fill="#3d9c69"/><text x="11.5" y="17.5" font-size="7" font-weight="700" fill="#fff" text-anchor="middle" font-family="Segoe UI,sans-serif">X</text></svg>',
  pdf:'<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#d93025"/><path d="M14 2l6 6h-6z" fill="#f26a60"/><text x="11.5" y="17.5" font-size="5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Segoe UI,sans-serif">PDF</text></svg>',
  dir:'<svg viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#d8a432"/><path d="M2 8h20v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#f0c258"/></svg>',
};

const $ = s => document.querySelector(s);
const qi = $('#qi'), typed = $('#typed'), list = $('#list'), fl = $('#fl'), fr = $('#fr'),
      key = $('#key'), k1 = $('#k1'), k2 = $('#k2'), toast = $('#toast'), mouse = $('#mouse');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0;

function reset(){
  typed.textContent = ''; typed.classList.add('ph');
  list.innerHTML = ''; list.style.display = 'none';
  fl.textContent = '文件搜索 · 输入关键词'; fl.className = 'l';
  fr.textContent = '↑↓ 选择    Enter 打开    Esc 关闭';
  qi.className = ''; key.className = ''; toast.className = ''; mouse.style.opacity = 0;
}
async function typeText(t, ph, speed = 62){
  typed.classList.toggle('ph', !!ph);
  typed.textContent = '';
  for (const ch of t){ typed.textContent += ch; await sleep(speed); }
}
async function pressKey(){
  key.classList.add('on'); await sleep(180);
  k1.classList.add('down'); k2.classList.add('down'); await sleep(120);
  k1.classList.remove('down'); k2.classList.remove('down'); await sleep(140);
  key.classList.remove('on');
}
async function show(){ qi.className = 'on'; await sleep(220); }
async function hide(){ qi.className = 'off'; await sleep(200); qi.className = ''; }
async function toastMsg(html, ms = 2200){
  toast.innerHTML = html; toast.className = 'on'; await sleep(ms); toast.className = '';
}
async function popRows(n, withSel){
  list.style.display = 'block';
  list.innerHTML = HITS.slice(0, n).map((h, i) => `
    <div class="row" data-i="${i}">
      <span class="ico">${ICONS[h.k]}</span>
      <span class="nm">${h.n}</span>
      <span class="pth">${h.p}</span>
    </div>`).join('');
  const rows = [...list.querySelectorAll('.row')];
  for (let i = 0; i < rows.length; i++){ rows[i].classList.add('in'); await sleep(90); }
  if (withSel) rows[0].classList.add('sel');
  return rows;
}

// ── 四个场景 ──
async function sceneDsh(id){
  await pressKey(); await show();
  await typeText('把上面三条整理成提纲', false);
  fl.textContent = '→ DSH 新会话 · 扩展已连接'; fl.className = 'l ok';
  await sleep(700);
  fr.textContent = 'Enter 发送    Shift+Enter 换行    Esc 取消';
  await sleep(500);
  await hide();
  await toastMsg('<b>内容已经进 DSH 了。</b>你正在看的那个窗口一下都没动过。', 2400);
}
async function sceneSite(id){
  await pressKey(); await show();
  await typeText('hh 800库', false);
  fl.textContent = '→ 小红书 搜索 · 回车直接打开浏览器'; fl.className = 'l purple';
  await sleep(900);
  await hide();
  await toastMsg('浏览器打开 <b>小红书</b>，搜索「800库」。', 2000);
}
async function sceneFiles(id){
  await pressKey(); await show();
  await typeText('/季度报告', false, 72);
  const rows = await popRows(4, true);
  fl.textContent = '文件搜索 · 4 条 · 31ms';
  await sleep(600);
  for (let i = 1; i < rows.length; i++){
    rows[i-1].classList.remove('sel'); rows[i].classList.add('sel');
    await sleep(420);
  }
  await sleep(400);
  await hide();
  await toastMsg('回车 → 用默认程序打开 <b>报告归档</b>。<br>Ctrl+Enter 是在资源管理器里定位它。', 2600);
}
async function sceneKeep(id){
  await pressKey(); await show();
  await typeText('/报告', false);
  const rows = await popRows(4, true);
  fl.textContent = '文件搜索 · 11 条 · 28ms · 第 1 / 11 条';
  await sleep(800);
  // 鼠标移到浮层外面点一下
  mouse.style.opacity = 1; mouse.style.left = '120px'; mouse.style.top = '560px';
  await sleep(700);
  await hide(); mouse.style.opacity = 0;
  await toastMsg('点浮层外面，它自己收起了 —— 不用先按 Esc。', 1800);
  await sleep(300);
  await pressKey(); await show();
  fl.textContent = '文件搜索 · 11 条 · 28ms · 第 1 / 11 条';
  await popRows(4, true);
  await toastMsg('<b>再按 Alt+J，原样回来了。</b>文字、结果、选中位置、滚动位置，一个都没丢。', 2800);
  await hide();
}

const RUN = { dsh: sceneDsh, site: sceneSite, files: sceneFiles, keep: sceneKeep };

async function play(idx){
  const my = ++runId;
  reset();
  for (let i = idx; i < SCENES.length; i++){
    if (my !== runId) return;
    setActive(i);
    await RUN[SCENES[i].id](SCENES[i].id);
    if (my !== runId) return;
    await sleep(500);
  }
  if (my === runId) { setActive(-1); await sleep(1200); if (my === runId) play(0); }
}
function setActive(i){
  document.querySelectorAll('.sbtn').forEach((b, j) => b.classList.toggle('active', j === i));
  if (i >= 0){ $('#title').textContent = SCENES[i].title; $('#sub').textContent = SCENES[i].sub; }
  else { $('#title').textContent = '演示结束'; $('#sub').textContent = '点场景重看某一段，或点「重播」。'; }
}

// 场景按钮
SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'sbtn'; b.textContent = s.label;
  b.onclick = () => { runId++; setTimeout(() => play(i), 30); };
  $('#scenes').appendChild(b);
});
$('#replay').onclick = () => { runId++; setTimeout(() => play(0), 30); };

// 开演
window.addEventListener('load', () => setTimeout(() => play(0), 600));
</script>
</body>
</html>
